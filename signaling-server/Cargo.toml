[package]
name = "signaling-server"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
chrono = { version = "0.4.44", features = ["serde"] }
dashmap = "6.2.1"
tokio = { version = "1.52.3", features = ["net", "time", "macros", "rt-multi-thread", "sync"] }
dotenvy = "0.15.7"
base64 = "0.22"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
rand = "0.10.1"